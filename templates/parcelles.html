<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Parcelles - AGRISKI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="nav_bar">
        <div class="brand">AGRI_LTY</div>
        <a href="/" class="back-link">← Retour Dashboard</a>
    </header>

    <main class="container">
        <h1 class="section-title">Gestion des Parcelles</h1>

        <div class="list-vertical">
            {% for p in parcelles %}
            <div class="parcelle-item">
                <div class="parcelle-info">
                    <span class="parcelle-name">{{ p['nom'] }}</span>
                    <small>{{ p['localisation'] }} — {{ p['surface_ha'] }} ha</small>
                </div>
                <!-- Un petit badge pour le style -->
                <div class="status-badge">Actif</div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
