<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRISKI - Tableau de Bord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="nav_bar">
        <div class="brand">AGRI_LTY</div>
    </header>

    <main class="container">
        
        <div class="dashboard-top">
            <div class="alert-box">
                <span class="icon-warning">⚠️</span> ALERTE !
            </div>

            <div class="weather-widget">
                <div class="weather-header">
                    <span>Météo ☀️</span>
                    <span class="location">📍 Perpignan</span>
                </div>
                <div class="weather-main">
                    <span class="weather-icon">☁️</span>
                    <span class="temperature">14 <small>°C</small></span>
                </div>
                <div class="weather-details">
                    Précipitations: 7% | Humidité: 89% | Vent: 11 km/h
                </div>
            </div>
        </div>

        <h1 class="section-title">Tableau de bord</h1>

        <div class="grid">
            <div class="card-empty">
                <div class="card-info">
                    <strong>Parcelle Nord-A1</strong><br>
                    <small>État : Risque Mildiou</small>
                </div>
            </div>
            <div class="card-empty">
                <div class="card-info">
                    <strong>Parcelle Sud-B2</strong><br>
                    <small>État : Optimal</small>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-link active">Tableau de Bord</a>
            <a href="parcelles.html" class="nav-link">Mes Parcelles</a>
            <a href="#" class="nav-link">Observations</a>
        </nav>

    </main>

</body>
</html>
